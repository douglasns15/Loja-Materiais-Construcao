name = "nexoloja-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
# nodejs_compat é necessário para o driver `pg` rodar no Worker (item 3 / ADR-005).
compatibility_flags = ["nodejs_compat"]

# Variáveis públicas (não-segredas)
[vars]
SUPABASE_URL = "https://esxssekaflzewibbklpu.supabase.co"

# --- Observabilidade (Workers Logs) ---
# Retém logs/exceções do Worker (~3 dias no dashboard, incluído no free tier) para que um
# incidente transitório (cold start do pool, 5xx pontual, "Failed to fetch" do cliente) possa
# ser investigado DEPOIS que acontece. Sem isto, `wrangler tail` só mostra eventos ao vivo e o
# passado se perde. `head_sampling_rate = 1` = registra 100% das requisições (volume baixo).
# Ver no dashboard: Workers & Pages → nexoloja-api → Logs. Só passa a valer após o deploy.
[observability]
enabled = true
head_sampling_rate = 1

# --- Hyperdrive → Supabase (ADR-005) ---
# Conexão poolada na edge. A origem configurada é o POOLER do Supabase (Supavisor) em
# MODO SESSÃO — host `aws-1-us-west-2.pooler.supabase.com`, porta 5432, user
# `postgres.<ref>` (endpoint IPv4; o host direto `db.<ref>.supabase.co` é IPv6-only no
# free tier). NÃO usar a porta 6543 (transação): o Hyperdrive já pooleia e empilhar
# pooler-sobre-pooler causa instabilidade — a Cloudflare recomenda a conexão de sessão.
# Ver `docs/plano-producao.md`. Recriar com:
#   npx wrangler hyperdrive create nexoloja-db --connection-string="<POOLER_SESSION_URL:5432>"
# Cache de leitura DESABILITADO (evita listas velhas após escrita num ERP/POS):
#   npx wrangler hyperdrive update <id> --caching-disabled
# Conexões que o Hyperdrive mantém no origin: origin_connection_limit = 20 (baixar se
# aparecer "too many connections" sob carga).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "7b728afad9a643f096bfbcdb6d0724ea"

# --- Cloudflare R2: mídia da loja (ADR-007) ---
# Binding do bucket de mídia. O Worker faz put/get/delete direto (sem chaves S3,
# sem CORS de bucket). Criar o bucket uma única vez com:
#   npx wrangler r2 bucket create nexoloja-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "nexoloja-media"

# --- Desenvolvimento local ---
# Sem Hyperdrive, defina DATABASE_URL em apps/api/.dev.vars (NÃO commitar):
#   DATABASE_URL="postgresql://...:6543/postgres?pgbouncer=true"
